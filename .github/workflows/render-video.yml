name: Render video

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run build:jersey
      - run: npm run build:chalpha
      - run: npm run build:chalpha-stats
      - run: npm run build:chalpha-kv
      - uses: actions/upload-artifact@v4
        with:
          name: videos
          path: out/*.mp4
